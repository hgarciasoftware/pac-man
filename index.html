<!DOCTYPE html>
<html lang="en">
  <head>
    <title>PAC-MAN | GROUP 2 | CISC 3140 - FALL 2026</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./index.css">
  </head>
  <body>
    <main id="game-container">
      <canvas id="game" width="570" height="690"></canvas>
      <div class="debug">
        <div>Coordinates:</div>
        <div id="coordinates">waiting for input&hellip;</div>
        <div>FPS:</div>
        <div id="fps">waiting&hellip;</div>
      </div>
    </div>
    <script type="module">
      import { GameState, setState } from './state.js';
      import { initMenu } from './menu.js';
      import { initCharacterSelect } from './characterSelect.js';
      import { initHighScoresMenu } from './highScoresMenu.js';
      // import { initSettingsMenu } from './settingsMenu.js';
      import { startGameLoop } from './player_movement.js';

      const container = document.querySelector('#game-container');
      const onPlay = () => {
        setState(GameState.PLAYING);
        startGameLoop();
      };

      initMenu({container});
      initCharacterSelect({container, onPlay});
      initHighScoresMenu({container});
      // initSettingsMenu({container});
      setState(GameState.MENU);
    </script>
  </body>
</html>
