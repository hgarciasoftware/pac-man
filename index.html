<!DOCTYPE html>
<html lang="en">
  <head>
    <title>PAC-MAN | GROUP 2 | CISC 3140 - FALL 2026</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./index.css">
  </head>
  <body>
    <main id="game-container">
      <canvas id="game" width="570" height="690"></canvas>
      <div class="debug">
        <div>Coordinates:</div>
        <div id="coordinates"></div>
      </div>
    </div>
    <!-- player_movement.js must be loaded first -->
    <!-- player_movement.js currently defines the player -->
    <script src="player_movement.js"></script>
    <!-- maze_demo.js depends on the player already being defined -->
    <script src="maze_demo.js"></script>
    <script type="module">
      import { GameState, setState } from './state.js';
      import { initMenu } from './menu.js';

      const container = document.querySelector('#game-container');
      const onPlay = () => {
        setState(GameState.PLAYING);
      };

      initMenu({container, onPlay});
      setState(GameState.MENU);
    </script>
  </body>
</html>
